{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<head>
    <style>

        .form-container {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
            background-color: rgba(200, 200, 200, 0.8);
            border-radius: 10px;
            padding: 10px;
        }

        .footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }
               .container-margin-bottom {
            margin-bottom: 100px;
        }

</style>
</head>
<body>


  <h1 style="text-align: center;">Password Reset</h1>


      <form method="POST">
        <div class="form-container">

    <label for="email">Email Address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Enter APC email"
      value="{% if prev_data.email %}{{ prev_data.email }}{% endif %}"
    />


    <input type="submit" class="btn btn-primary" name='secret_key' value="Email Secret Key">
    <br>
    </div>

    <div class="form-container">




    <label for="password1">Enter New Password</label>
    <input
      type="password"
      class="form-control"
      id="password1"
      name="password1"
      placeholder="Enter New password"
    />


    <label for="password2">Confirm Password</label>
    <input
      type="password"
      class="form-control"
      id="password2"
      name="password2"
      placeholder="Confirm password"
    />


        <label for="secret_key">Secret Key</label>
    <input
      type="password"
      class="form-control"
      id="secret_key"
      name="secret_key"
      placeholder="Enter Secret Key"
    />
<br>
  <br>
      <br>
  <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>



          <div class="container-margin-bottom"></div>
    <div class="footer">
        Created and Managed by Tyler Yahnke and Joel Fuentes
        <br>
        Version 3.0
    </div>
</body>
{% endblock %}
