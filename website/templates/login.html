{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content%}
<head>
<style>
  .button-container {
    display: flex;
    justify-content: space-between;
  }

  .button-container .right-buttons {
    display: flex;
  }

  .button-container .right-buttons button {
    margin-right: 10px;
  }

          .form-container {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
            background-color: rgba(200, 200, 200, 0.8);
            border-radius: 10px;
            padding: 10px;

        }

</style>
</head>


<form method="POST">
  <h3 align="center">Login</h3>
    <div class="form-container">
    <label for="email">Email Address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Enter email"
    />

    <label for="password">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      name="password"
      placeholder="Enter password"
    />
    <input type="checkbox" onclick="myFunction()">Show Password</input>
</div>

<div class="button-container">
  <button type="submit" class="btn btn-primary">Login</button>
  <div class="right-buttons">
    <button type="button" class="btn btn-primary" id="passwordReset">Password Reset</button>
    <button type="button" class="btn btn-primary" id="firstTimeUser">First Time User</button>
  </div>
</div>

<script>
  const passwordResetButton = document.getElementById('passwordReset');
  passwordResetButton.addEventListener('click', () => {
    window.location.href = '/password_reset'; //
  });
</script>
  <script>
  const NewUserButton = document.getElementById('firstTimeUser');
  NewUserButton.addEventListener('click', () => {
    window.location.href = '/password_reset'; //
  });
</script>

  <script>
function myFunction() {
  var x = document.getElementById("password");
  if (x.type === "password") {
    x.type = "text";
  } else {
    x.type = "password";
  }
}
</script>


</form>
{% endblock %}
