{% extends "base.html" %}

{% block title %}Document Generator{% endblock %}

{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>NOD Letter Generator</title>
    <link href="https://fonts.googleapis.com/css?family=Raleway&display=swap" rel="stylesheet">
    <style>
        .modern-heading {
            text-align: center;
            font-family: 'Raleway', sans-serif;
            font-size: 48px;
            color: #7dbb5a;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid #7dbb5a;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .form-container{
            flex-wrap: wrap;
            margin-bottom: 10px;
            background-color: rgba(200, 200, 200, 0.8);
            border-radius: 10px;
            padding: 10px;
        }


        .form-container-buttons {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 10px;
        background-color: rgba(200, 200, 200, 0.8);
        border-radius: 10px;
        padding: 10px;
        }

        .footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }
               .container-margin-bottom {
            margin-bottom: 100px;
        }
    </style>
</head>

<body>
    <h1 class="modern-heading">NOD Letter Generator</h1>

    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">

            <label>Enter the LAI and click Generate Doc to generate a Notice of Default (NOD):</label>

            <br>

            <label>LAI-</label>
        <input type="text" id="lai" name="lai" value="{{ previous_data.lai if previous_data.lai != '' else '' }}">
            <br>
            <label>NOD Type</label>
            <select name="nod_type">
                <option value="Make Selection" {% if previous_data.nod_type == 'Make Selection' %}selected{% endif %}>Make Selection</option>
                <option value="Covenant Default" {% if previous_data.nod_type == 'Covenant Default' %}selected{% endif %}>Covenant Default</option>
                <option value="Payment Default" {% if previous_data.nod_type == 'Payment Default' %}selected{% endif %}>Payment Default</option>
            </select>
            <br>
            <br>
            <br>
            <label>Note: The NOD should ALWAYS be verified by the PM prior to being sent to the customer.</label>
            <br>
            <input type="submit" name='generate_docs' class="btn btn-primary" value="Generate Doc">
        </form>


    <div class="container-margin-bottom"></div>
    <div class="footer">
        Created and Managed by Tyler Yahnke
        <br>
        &copy; 2025 ApplePie Capital, Version 5.0
    </div>


</body>
</html>
{% endblock %}
